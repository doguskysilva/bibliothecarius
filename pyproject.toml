[project]
name = "bibliothecarius"
version = "0.1.0"
description = "A cli application to manager canons, translates and books"
authors = [{ name = "Douglas Silva", email = "dogusky@protonmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"pytest>=8.2.2,<9.0.0",
	"alembic>=1.13.1,<2.0.0",
	"click>=8.1.7,<9.0.0",
	"python-dotenv>=1.0.1,<2.0.0",
	"requests>=2.32.3,<3.0.0",
	"sqlalchemy>=2.0.46,<3.0.0",
	"pytest-mock>=3.14.0,<4.0.0",
	"faker>=26.3.0,<27.0.0",
	"factory-boy>=3.3.0,<4.0.0",
	"pytest-cov>=5.0.0,<6.0.0",
	"pandas>=2.3.1,<3.0.0",
]

[project.scripts]
bibliothecarius = "bibliothecarius.main:main"

[dependency-groups]
dev = [
	"ipykernel>=6.30.0,<7.0.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"
