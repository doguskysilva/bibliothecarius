name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies with uv
        run: |
          uv sync
      - name: Lint with Ruff
        run: |
          uv run ruff check .
      - name: Create database to test
        run: |
          mkdir -p database
          touch database/scripturas-test.sqlite
      - name: Run unit tests
        run: |
          uv run pytest tests/unit

      - name: Run integration tests
        run: |
          uv run pytest tests/integration
